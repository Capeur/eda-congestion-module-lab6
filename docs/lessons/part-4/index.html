.fp-legal { font-family: var(--body); font-weight: 700; font-size: 1.9cqw; background: var(--surface); border: 2px solid var(--line); border-radius: .9cqw; padding: .4cqw 1.1cqw; white-space: nowrap; }
.fp-legal.yes { color: var(--g1); border-color: var(--g1); }
.fp-legal.no { color: var(--cut); border-color: var(--cut); }
.fp-counter { min-width: 17cqw; }
.fp-thumb svg { max-height: 16cqw; }
.fp-ops .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.norec .fp-overzone { transition: none !important; }

/* ---------- placement scene (v5) ---------- */
.pl-chip { fill: var(--tint0); stroke: none; }
.pl-gridlines line { stroke: var(--line); stroke-width: 1; opacity: .55; }
/* v5.1 heat grid: the GCell lattice and one tile per GCell, painted from the deposit replay */
.pl-glines line { stroke: var(--heavy); stroke-width: 1.4; stroke-dasharray: 6 4; opacity: .6; }
.pl-tile { stroke: none; }
.pl-tilering { fill: none; stroke: var(--ink); stroke-width: 3; opacity: 0; }
.pl-tilering.hl { opacity: 1; }
.pl-wall { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 10 6; opacity: .5; transition: stroke .15s, opacity .15s; }
.pl-wall.hit { stroke: var(--cut); opacity: 1; }
.pl-axis text { font-family: var(--mono); font-size: 12px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.pl-axis .pl-axis-y { text-anchor: end; }
.pl-net rect { fill: var(--edge); fill-opacity: .05; stroke: var(--edge); stroke-width: 1.6; }
.pl-net line { stroke: var(--copper); stroke-width: 2.4; stroke-linecap: round; opacity: .8; }
.pl-net text { font-family: var(--mono); font-size: 13px; font-weight: 500; fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--stage); stroke-width: 4px; }
.pl-net.hot rect { stroke: var(--heavy); stroke-width: 2.6; fill: var(--heavy); fill-opacity: .08; }
.pl-trial { fill: none; stroke: var(--heavy); stroke-width: 2; stroke-dasharray: 6 5; }
.plk { cursor: grab; outline: none; touch-action: none; }
.plk rect { stroke: var(--surface); stroke-width: 1.5; }
.plk text, .pl-ghost text { fill: #fff; font-family: var(--body); font-weight: 700; font-size: 16px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.plk .pl-ring { fill: none; stroke: var(--ink); stroke-width: 2.5; opacity: 0; }
.plk.hl .pl-ring, .plk:focus-visible .pl-ring { opacity: 1; }
.plk.pad rect:not(.pl-ring) { stroke: var(--ink); stroke-width: 2.5; }
.pl-ghost rect { fill: var(--heavy); fill-opacity: .35; stroke: var(--heavy); stroke-width: 2; stroke-dasharray: 5 4; }
.pl-ghost.bad rect { fill: var(--cut); stroke: var(--cut); }
.pl-ghost text { fill: var(--ink); }
.pl-bestpos rect { fill: none; stroke-width: 2.2; stroke-dasharray: 4 4; }
.pl-thermo .tube { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.pl-thermo text { font-family: var(--mono); font-size: 13px; fill: var(--muted); text-anchor: middle; }
.pl-thermo text.v { font-size: 14px; font-weight: 500; fill: var(--ink); font-variant-numeric: tabular-nums; }
.pl-card text { font-family: var(--body); font-size: 18px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.pl-card .delta { font-family: var(--mono); font-size: 21px; font-weight: 500; }
.pl-card .delta.worse, .pl-card .verdict.no { fill: var(--cut); }
.pl-card .delta.better, .pl-card .verdict.yes { fill: var(--g1); }
.pl-card .delta.free, .pl-card .verdict.free { fill: var(--muted); }
.pl-card .verdict { font-weight: 700; font-size: 22px; text-anchor: end; }
.pl-dice .track { fill: var(--line); fill-opacity: .55; stroke: var(--edge); stroke-width: 1.2; }
.pl-dice .pfill { fill: var(--g1); opacity: .75; }
.pl-dice .pfill.sure { opacity: .3; }
.pl-dice text { font-family: var(--body); font-size: 15.5px; fill: var(--muted); }
.pl-dice text.u { font-family: var(--mono); font-size: 13.5px; text-anchor: middle; fill: var(--ink); }
.pl-dice .marker line { stroke: var(--ink); stroke-width: 2.5; }
.pl-dice .marker circle { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.pl-dice .marker.yes circle { fill: var(--g1); } .pl-dice .marker.no circle { fill: var(--cut); }
.pl-tally text { font-family: var(--body); font-size: 17px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; white-space: pre; }
.pl-tally text.kinds { font-size: 15px; font-weight: 400; fill: var(--muted); }
.pl-chart .axis, .pl-spread .axis { stroke: var(--edge); stroke-width: 1.5; }
.pl-chart .cur { fill: none; stroke: var(--g0); stroke-width: 2.4; stroke-linejoin: round; }
.pl-chart .best { fill: none; stroke: var(--g1); stroke-width: 2; stroke-dasharray: 5 4; }
.pl-chart .dot { fill: var(--g0); stroke: var(--surface); stroke-width: 2; }
.pl-chart .startline { stroke: var(--edge); stroke-width: 1; stroke-dasharray: 3 5; }
.pl-chart text, .pl-spread text { font-family: var(--mono); font-size: 12.5px; fill: var(--muted); }
.pl-chart .tick { text-anchor: end; dominant-baseline: central; }
.pl-chart .tick.x, .pl-spread .tick.x { text-anchor: start; dominant-baseline: auto; }
.pl-chart .tick.x.end { text-anchor: end; } .pl-spread .tick.x.mid { text-anchor: middle; }
.pl-chart .lab.start { text-anchor: end; }
.pl-chart .lab.bestl { fill: var(--g1); font-weight: 500; }
.pl-spread .d { fill: var(--edge); }
.pl-spread .d.hot { fill: var(--heavy); stroke: var(--surface); stroke-width: 1.5; }
.pl-spread .median { stroke: var(--g0); stroke-width: 2; stroke-dasharray: 5 4; }
.pl-spread .lab.med { fill: var(--g0); }
.pl-spread .lab.hot { fill: var(--heavy); font-weight: 500; font-size: 13.5px; paint-order: stroke; stroke: var(--stage); stroke-width: 4px; }
.pl-spread .lab.endl { text-anchor: end; }
.pl-spread .lead { stroke: var(--heavy); stroke-width: 1.2; }
.pl-spread .scap { font-family: var(--body); font-size: 15px; fill: var(--ink); }
.pl-counter { min-width: 17cqw; }
.pl-ops label { display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; }
.pl-seed { width: 5.5em; font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.pl-thumb svg { width: 11cqw; }
.pl-piles rect { fill: none; stroke: var(--cut); stroke-width: 3; }
.pl-piles circle { fill: var(--cut); stroke: var(--surface); stroke-width: 2; }
.pl-piles text { fill: #fff; font-family: var(--mono); font-weight: 500; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
.pl-land .ground { fill: var(--tint1); stroke: none; }
.pl-land .line { fill: none; stroke: var(--g1); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pl-land .ball { fill: var(--heavy); stroke: var(--surface); stroke-width: 2.5; }
.pl-land .lab { font-family: var(--body); font-size: 15.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }

/* ---------- inside the all-parts player ---------- */
html.embedded body { background: transparent; padding: 0 2px 6px; margin: 0; }
html.embedded .wrap > header .eyebrow { display: none; }
html.embedded .wrap > header h1 { font-size: clamp(20px, 2.6vw, 28px); margin-top: 0; }

/* ---------- subtitles menu ---------- */
.subsel { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.subsel select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
.captions:lang(zh) { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; letter-spacing: .02em; }

/* ---------- sounds button ---------- */
.sbtn { font-family: var(--mono); font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
.sbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sbtn[aria-pressed="false"] { color: var(--muted); }
.opts { flex-wrap: wrap; }

</style>
